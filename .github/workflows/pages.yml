name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install dependencies and Warren
        run: |
          moon update
          moon install moonbit-community/warren

      - name: Test
        run: moon test

      - name: Build
        run: warren build --browser-entry src/main --server-entry ""

      # サブパス /gh-lg-search/ で動かすため、絶対パスの読み込みを相対パスにする（必要な場合のみ）
      - name: Fix asset paths for project pages
        run: sed -i 's#src="/index.js"#src="./index.js"#' dist/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
